<svg viewBox="0 0 1900 1255" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Arial, sans-serif" aria-label="Lumina Dental AWS architecture: users reach CloudFront and WAF, then an Application Load Balancer, which forwards HTTP traffic to an Auto Scaling Group of EC2 instances split across two Availability Zones inside a VPC; instances connect to a Multi-AZ RDS PostgreSQL database in isolated private subnets; CloudWatch, SNS and Systems Manager form a separate monitoring and management path; Route 53 and HTTPS are marked as planned but not implemented.">
  <defs>
    <marker id="aSolid" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="aPurple" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8C4FFF"/>
    </marker>
    <marker id="aIndigo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3F51B5"/>
    </marker>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#757575"/>
    </marker>
    <marker id="aMagenta" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C2185B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1900" height="1255" fill="#FCFCFD"/>
  <text x="950" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#16191F">Lumina Dental — AWS Solution Architecture (As Implemented)</text>

  <!-- ================= EDGE LAYER ================= -->
  <!-- Users -->
  <g>
    <circle cx="840" cy="62" r="10" fill="none" stroke="#16191F" stroke-width="2.5"/>
    <path d="M822,92 Q840,68 858,92" fill="none" stroke="#16191F" stroke-width="2.5"/>
    <text x="840" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#16191F">Users / Clients</text>
  </g>
  <line x1="840" y1="120" x2="840" y2="150" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>

  <!-- Planned / not implemented callout -->
  <rect x="380" y="140" width="300" height="122" rx="10" fill="#F2F2F2" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="530" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B00020">PLANNED — NOT IMPLEMENTED</text>
  <text x="530" y="186" text-anchor="middle" font-size="12.5" fill="#333333">Amazon Route 53 (DNS)</text>
  <text x="530" y="207" text-anchor="middle" font-size="12.5" fill="#333333">AWS Certificate Manager (TLS)</text>
  <text x="530" y="228" text-anchor="middle" font-size="12.5" fill="#333333">ALB HTTPS Listener :443</text>
  <text x="530" y="250" text-anchor="middle" font-size="11" font-style="italic" fill="#666666">No domain was purchased — app served over HTTP</text>

  <!-- CloudFront -->
  <rect x="725" y="150" width="230" height="80" rx="10" fill="#F4ECFF" stroke="#8C4FFF" stroke-width="2.5"/>
  <path d="M748,178 a10,10 0 1,1 0.2,0 M745,182 h20 M748,186 h14" fill="none" stroke="#8C4FFF" stroke-width="1.6"/>
  <text x="850" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#4A2A85">Amazon CloudFront</text>
  <text x="850" y="205" text-anchor="middle" font-size="11.5" fill="#4A2A85">Edge cache · origin = ALB</text>

  <!-- WAF -->
  <rect x="1005" y="150" width="230" height="80" rx="10" fill="#FDEAEC" stroke="#DD344C" stroke-width="2.5"/>
  <path d="M1024,172 l8,-5 l8,5 v10 c0,7 -4,11 -8,13 c-4,-2 -8,-6 -8,-13 z" fill="none" stroke="#B0002A" stroke-width="1.6"/>
  <text x="1130" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#8A0021">AWS WAF</text>
  <text x="1130" y="205" text-anchor="middle" font-size="11.5" fill="#8A0021">Web ACL: dental-waf</text>

  <line x1="955" y1="190" x2="1005" y2="190" stroke="#8C4FFF" stroke-width="2" marker-end="url(#aPurple)" marker-start="url(#aPurple)"/>
  <text x="980" y="180" text-anchor="middle" font-size="10" fill="#555555">inspects</text>

  <line x1="850" y1="230" x2="850" y2="270" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>

  <!-- Internet Gateway -->
  <rect x="775" y="270" width="150" height="55" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="850" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">Internet Gateway</text>
  <text x="850" y="309" text-anchor="middle" font-size="10.5" fill="#555555">aws-project-igw</text>

  <line x1="850" y1="325" x2="850" y2="355" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>

  <!-- ALB -->
  <rect x="725" y="355" width="230" height="80" rx="10" fill="#F4ECFF" stroke="#8C4FFF" stroke-width="2.5"/>
  <text x="840" y="386" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4A2A85">Application Load Balancer</text>
  <text x="840" y="405" text-anchor="middle" font-size="11" fill="#4A2A85">Internet-facing · HTTP :80 · alb-sg</text>
  <text x="840" y="422" text-anchor="middle" font-size="10" fill="#4A2A85">Target Group: instance / HTTP:80</text>

  <!-- ================= VPC ================= -->
  <rect x="60" y="465" width="1560" height="655" rx="16" fill="none" stroke="#8C4FFF" stroke-width="3" stroke-dasharray="12,6"/>
  <text x="90" y="483" font-size="15" font-weight="700" fill="#4A2A85">VPC · aws-project-vpc · 10.0.0.0/16</text>

  <!-- AZ1 -->
  <rect x="100" y="560" width="700" height="525" rx="10" fill="#FAFAFE" stroke="#1976D2" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="450" y="585" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0D47A1">Availability Zone 1 (AZ-1)</text>

  <!-- AZ1 Public subnet -->
  <rect x="140" y="600" width="620" height="100" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="152" y="618" font-size="11.5" font-weight="700" fill="#2E7D32">Public-Subnet-AZ1 · 10.0.1.0/24</text>
  <rect x="390" y="628" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#4CAF50" stroke-width="1.8"/>
  <text x="450" y="649" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32">NAT Gateway</text>
  <text x="450" y="665" text-anchor="middle" font-size="10" fill="#2E7D32">az1 + dedicated EIP</text>
  <text x="152" y="690" font-size="9.5" font-style="italic" fill="#43A047">ALB elastic network interface resides here</text>

  <!-- AZ1 Private App subnet -->
  <rect x="140" y="730" width="620" height="190" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="152" y="763" font-size="11.5" font-weight="700" fill="#0D47A1">Private-App-Subnet-AZ1 · 10.0.11.0/24</text>
  <rect x="185" y="768" width="150" height="112" rx="8" fill="#FFF3E0" stroke="#ED7100" stroke-width="2"/>
  <text x="260" y="800" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8C4300">EC2 · t3.small</text>
  <text x="260" y="818" text-anchor="middle" font-size="10" fill="#8C4300">Nginx :80</text>
  <text x="260" y="833" text-anchor="middle" font-size="10" fill="#8C4300">Next.js :3000</text>
  <text x="260" y="848" text-anchor="middle" font-size="10" fill="#8C4300">FastAPI :8000 (loopback)</text>
  <text x="450" y="832" text-anchor="middle" font-size="22" font-weight="700" fill="#9E9E9E">···</text>
  <rect x="565" y="768" width="150" height="112" rx="8" fill="#FFF3E0" stroke="#ED7100" stroke-width="2"/>
  <text x="640" y="800" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8C4300">EC2 · t3.small</text>
  <text x="640" y="818" text-anchor="middle" font-size="10" fill="#8C4300">Nginx :80</text>
  <text x="640" y="833" text-anchor="middle" font-size="10" fill="#8C4300">Next.js :3000</text>
  <text x="640" y="848" text-anchor="middle" font-size="10" fill="#8C4300">FastAPI :8000 (loopback)</text>

  <!-- AZ1 Private DB subnet -->
  <rect x="140" y="950" width="620" height="110" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
  <text x="152" y="968" font-size="11.5" font-weight="700" fill="#283593">Private-DB-Subnet-AZ1 · 10.0.21.0/24</text>
  <text x="152" y="983" font-size="9.5" font-style="italic" fill="#3949AB">isolated — route table has no internet path</text>
  <rect x="340" y="992" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="450" y="1015" text-anchor="middle" font-size="11.5" font-weight="700" fill="#283593">Amazon RDS PostgreSQL</text>
  <text x="450" y="1032" text-anchor="middle" font-size="10.5" fill="#283593">Primary</text>

  <!-- AZ2 -->
  <rect x="880" y="560" width="700" height="525" rx="10" fill="#FAFAFE" stroke="#1976D2" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="1230" y="585" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0D47A1">Availability Zone 2 (AZ-2)</text>

  <!-- AZ2 Public subnet -->
  <rect x="920" y="600" width="620" height="100" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="932" y="618" font-size="11.5" font-weight="700" fill="#2E7D32">Public-Subnet-AZ2 · 10.0.2.0/24</text>
  <rect x="1170" y="628" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#4CAF50" stroke-width="1.8"/>
  <text x="1230" y="649" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32">NAT Gateway</text>
  <text x="1230" y="665" text-anchor="middle" font-size="10" fill="#2E7D32">az2 + dedicated EIP</text>
  <text x="932" y="690" font-size="9.5" font-style="italic" fill="#43A047">ALB elastic network interface resides here</text>

  <!-- AZ2 Private App subnet -->
  <rect x="920" y="730" width="620" height="190" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="932" y="763" font-size="11.5" font-weight="700" fill="#0D47A1">Private-App-Subnet-AZ2 · 10.0.12.0/24</text>
  <rect x="965" y="768" width="150" height="112" rx="8" fill="#FFF3E0" stroke="#ED7100" stroke-width="2"/>
  <text x="1040" y="800" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8C4300">EC2 · t3.small</text>
  <text x="1040" y="818" text-anchor="middle" font-size="10" fill="#8C4300">Nginx :80</text>
  <text x="1040" y="833" text-anchor="middle" font-size="10" fill="#8C4300">Next.js :3000</text>
  <text x="1040" y="848" text-anchor="middle" font-size="10" fill="#8C4300">FastAPI :8000 (loopback)</text>
  <text x="1230" y="832" text-anchor="middle" font-size="22" font-weight="700" fill="#9E9E9E">···</text>
  <rect x="1345" y="768" width="150" height="112" rx="8" fill="#FFF3E0" stroke="#ED7100" stroke-width="2"/>
  <text x="1420" y="800" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8C4300">EC2 · t3.small</text>
  <text x="1420" y="818" text-anchor="middle" font-size="10" fill="#8C4300">Nginx :80</text>
  <text x="1420" y="833" text-anchor="middle" font-size="10" fill="#8C4300">Next.js :3000</text>
  <text x="1420" y="848" text-anchor="middle" font-size="10" fill="#8C4300">FastAPI :8000 (loopback)</text>

  <!-- AZ2 Private DB subnet -->
  <rect x="920" y="950" width="620" height="110" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
  <text x="932" y="968" font-size="11.5" font-weight="700" fill="#283593">Private-DB-Subnet-AZ2 · 10.0.22.0/24</text>
  <text x="932" y="983" font-size="9.5" font-style="italic" fill="#3949AB">isolated — route table has no internet path</text>
  <rect x="1120" y="992" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="1230" y="1015" text-anchor="middle" font-size="11.5" font-weight="700" fill="#283593">Amazon RDS PostgreSQL</text>
  <text x="1230" y="1032" text-anchor="middle" font-size="10.5" fill="#283593">Standby (Multi-AZ)</text>

  <!-- ASG boundary -->
  <rect x="122" y="742" width="1456" height="168" rx="14" fill="#ED7100" fill-opacity="0.045" stroke="#ED7100" stroke-width="3" stroke-dasharray="11,6"/>
  <text x="850" y="714" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B35900">Auto Scaling Group · dental-asg · min 2 / desired 2 / max 6 · target-tracking on CPU utilisation</text>

  <!-- RDS replication -->
  <line x1="560" y1="1021" x2="1120" y2="1021" stroke="#3F51B5" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#aIndigo)" marker-start="url(#aIndigo)"/>
  <text x="840" y="1010" text-anchor="middle" font-size="10.5" font-style="italic" fill="#3949AB">synchronous replication · automatic failover promotes standby</text>

  <!-- EC2 -> RDS (data plane) -->
  <line x1="450" y1="920" x2="450" y2="950" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>
  <text x="470" y="940" font-size="10" fill="#333333">TCP 5432</text>
  <line x1="1230" y1="920" x2="1230" y2="950" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>
  <text x="1250" y="940" font-size="10" fill="#333333">TCP 5432</text>

  <!-- EC2 -> NAT (outbound only, dashed gray) -->
  <line x1="450" y1="768" x2="450" y2="682" stroke="#757575" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aGray)"/>
  <text x="470" y="725" font-size="9.5" fill="#616161">outbound only</text>
  <line x1="1230" y1="768" x2="1230" y2="682" stroke="#757575" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aGray)"/>
  <text x="1250" y="725" font-size="9.5" fill="#616161">outbound only</text>

  <!-- ALB -> AZ1 / AZ2 (elbow connectors, data plane) -->
  <polyline points="800,435 800,525 116,525 116,825 140,825" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>
  <text x="400" y="542" text-anchor="middle" font-size="10.5" fill="#333333">HTTP :80 → Target Group (AZ-1)</text>
  <polyline points="880,435 880,525 1604,525 1604,825 1540,825" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/>
  <text x="1300" y="542" text-anchor="middle" font-size="10.5" fill="#333333">HTTP :80 → Target Group (AZ-2)</text>

  <!-- ================= MONITORING / MANAGEMENT ================= -->
  <text x="1755" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#8A0F55">Monitoring &amp; Management</text>
  <text x="1755" y="555" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8A0F55">(control plane — dashed)</text>

  <rect x="1650" y="565" width="220" height="88" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="1760" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#8A0F55">Amazon CloudWatch</text>
  <text x="1760" y="610" text-anchor="middle" font-size="10" fill="#8A0F55">Metrics: ASG, ALB,</text>
  <text x="1760" y="624" text-anchor="middle" font-size="10" fill="#8A0F55">Target Group, RDS</text>
  <line x1="1760" y1="653" x2="1760" y2="672" stroke="#C2185B" stroke-width="2" marker-end="url(#aMagenta)"/>

  <rect x="1650" y="672" width="220" height="88" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="1760" y="699" text-anchor="middle" font-size="12" font-weight="700" fill="#8A0F55">CloudWatch Alarms</text>
  <text x="1760" y="717" text-anchor="middle" font-size="10" fill="#8A0F55">7 alarms · 5-min period</text>
  <text x="1760" y="731" text-anchor="middle" font-size="10" fill="#8A0F55">ASG / ALB / TG / RDS</text>
  <line x1="1760" y1="760" x2="1760" y2="779" stroke="#C2185B" stroke-width="2" marker-end="url(#aMagenta)"/>

  <rect x="1650" y="779" width="220" height="88" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="1760" y="806" text-anchor="middle" font-size="12" font-weight="700" fill="#8A0F55">Amazon SNS</text>
  <text x="1760" y="824" text-anchor="middle" font-size="10" fill="#8A0F55">Topic → email</text>
  <text x="1760" y="838" text-anchor="middle" font-size="10" fill="#8A0F55">subscription</text>

  <rect x="1650" y="900" width="220" height="88" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="1760" y="927" text-anchor="middle" font-size="12" font-weight="700" fill="#8A0F55">Systems Manager</text>
  <text x="1760" y="945" text-anchor="middle" font-size="10" fill="#8A0F55">Session Manager</text>
  <text x="1760" y="959" text-anchor="middle" font-size="10" fill="#8A0F55">via LuminaEC2SSMRole</text>

  <text x="1760" y="875" text-anchor="middle" font-size="10.5" fill="#333333">Administrator (AWS Console)</text>
  <line x1="1760" y1="879" x2="1760" y2="900" stroke="#333333" stroke-width="2" marker-end="url(#aSolid)"/>

  <!-- VPC -> CloudWatch metrics link (metrics flow up to CloudWatch) -->
  <polyline points="1590,745 1590,610 1648,610" fill="none" stroke="#C2185B" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#aMagenta)"/>
  <!-- SSM <-> EC2 session link -->
  <polyline points="1650,944 1560,944 1560,825 1495,825" fill="none" stroke="#C2185B" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#aMagenta)"/>
  <text x="1560" y="890" text-anchor="middle" font-size="9.5" fill="#8A0F55" transform="rotate(-90 1560 890)">Session Manager</text>

  <!-- ================= LEGEND ================= -->
  <rect x="60" y="1140" width="560" height="80" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="75" y="1160" font-size="12" font-weight="700" fill="#16191F">Component types</text>
  <rect x="75" y="1170" width="14" height="14" fill="#F4ECFF" stroke="#8C4FFF"/><text x="94" y="1181" font-size="10.5" fill="#333">Edge / CDN</text>
  <rect x="185" y="1170" width="14" height="14" fill="#FDEAEC" stroke="#DD344C"/><text x="204" y="1181" font-size="10.5" fill="#333">Security (WAF)</text>
  <rect x="315" y="1170" width="14" height="14" fill="#FFF3E0" stroke="#ED7100"/><text x="334" y="1181" font-size="10.5" fill="#333">Compute (EC2/ASG)</text>
  <rect x="75" y="1195" width="14" height="14" fill="#E8EAF6" stroke="#3F51B5"/><text x="94" y="1206" font-size="10.5" fill="#333">Database (RDS)</text>
  <rect x="220" y="1195" width="14" height="14" fill="#E8F5E9" stroke="#4CAF50"/><text x="239" y="1206" font-size="10.5" fill="#333">Networking (NAT/IGW)</text>
  <rect x="420" y="1195" width="14" height="14" fill="#FCE4EC" stroke="#C2185B"/><text x="439" y="1206" font-size="10.5" fill="#333">Monitoring / mgmt</text>

  <rect x="640" y="1140" width="480" height="80" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="655" y="1160" font-size="12" font-weight="700" fill="#16191F">Connector meaning</text>
  <line x1="655" y1="1174" x2="695" y2="1174" stroke="#333333" stroke-width="2.5" marker-end="url(#aSolid)"/><text x="702" y="1178" font-size="10.5" fill="#333">User / application traffic (data plane)</text>
  <line x1="655" y1="1194" x2="695" y2="1194" stroke="#757575" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aGray)"/><text x="702" y="1198" font-size="10.5" fill="#333">Outbound-only instance traffic</text>
  <line x1="655" y1="1210" x2="695" y2="1210" stroke="#C2185B" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aMagenta)"/><text x="702" y="1214" font-size="10.5" fill="#333">Monitoring / management (control plane)</text>

  <rect x="1140" y="1140" width="700" height="80" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="1155" y="1160" font-size="12" font-weight="700" fill="#16191F">Security boundaries (as implemented)</text>
  <text x="1155" y="1178" font-size="10.5" fill="#333">alb-sg (0.0.0.0/0 : 80) → ec2-sg (from alb-sg : 80) → rds-sg (from ec2-sg : 5432)</text>
  <text x="1155" y="1195" font-size="10.5" fill="#333">No public IPs on EC2 or RDS · no inbound SSH · admin access only via Systems Manager Session Manager</text>
  <text x="1155" y="1212" font-size="10.5" fill="#333">DB subnet route tables carry no internet route in either direction</text>

  <text x="950" y="1245" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666666">Reflects the architecture documented in docs/architecture.md. Route 53 and HTTPS were part of the target design but were not deployed (no domain purchased).</text>
</svg>
